<!DOCTYPE html>
<!--
  ===================================================================
  INSTRUÇÃO PARA IA / DESENVOLVEDOR (vale para qualquer conversa futura):
  Este arquivo tem um número de versão exibido na tela, ao lado do
  status "tudo salvo" (procure por id="appVersion").

  REGRA OBRIGATÓRIA: toda vez que este código for alterado, o número
  de versão em id="appVersion" deve ser incrementado, seguindo o
  formato vMAJOR.MINOR.PATCH:
    - a cada alteração, soma 1 no PATCH (último número)
    - quando o PATCH passaria de 9, ele volta a 0 e o MINOR soma 1
      (exemplo: v1.0.9 -> v1.1.0)
    - quando o MINOR passaria de 9, ele volta a 0 e o MAJOR soma 1
      (exemplo: v1.9.9 -> v2.0.0)
  Versão atual deste arquivo: v1.0.6
  ===================================================================
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Bloco de Notas</title>
<script>
  /* aplica o tema salvo antes de pintar a página, para não piscar */
  (function(){
    try{
      if(localStorage.getItem('blocoDark') === '1'){
        document.documentElement.classList.add('dark');
      }
    }catch(e){}
  })();
</script>
<style>
  :root{
    --bg:#ffffff;
    --panel-bg:#ffffff;
    --search-bg:#fafafa;
    --placeholder:#aaaaaa;
    --border:#d9d9d9;
    --text:#1a1a1a;
    --muted:#8a8a8a;
    --accent:#2f6fed;
    --bad:#c23b3b;
    --good:#2f7d4f;
    --tab-bg:#f4f4f4;
    --hi:#fff59d;
  }
  html.dark{
    --bg:#000000;
    --panel-bg:#141310;
    --search-bg:#141310;
    --placeholder:#6b6350;
    --border:#3a3527;
    --text:#f4ecd2;
    --muted:#a89a78;
    --accent:#5b9dff;
    --bad:#e5605c;
    --good:#4caf6e;
    --tab-bg:#141310;
    --hi:#fff59d;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  html{ background:var(--bg); }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    display:flex;
    flex-direction:column;
  }

  /* ---------------- GATE ---------------- */
  #gate{ flex:1; display:flex; align-items:center; justify-content:center; padding:24px; }
  .gate-box{ width:100%; max-width:380px; }
  .gate-title{ font-size:15px; font-weight:600; margin:0 0 18px; color:var(--text); }
  .url-row{
    display:flex; align-items:center;
    border:1px solid var(--border); border-radius:2px;
    padding:0 10px; margin-bottom:10px;
  }
  .url-row .prefix{ color:var(--muted); font-size:14px; white-space:nowrap; }
  .url-row input{
    flex:1; border:none; outline:none; padding:10px 6px;
    font-size:14px; color:var(--text); min-width:0; font-family:inherit;
  }
  input[type=password]{
    width:100%; border:1px solid var(--border); border-radius:2px;
    padding:10px; font-size:14px; outline:none; margin-bottom:8px;
    font-family:inherit; color:var(--text);
  }
  input:focus{border-color:var(--accent);}
  .btn{
    font-family:inherit; font-size:13px; font-weight:600;
    border:1px solid var(--text); background:var(--text); color:var(--bg);
    border-radius:2px; padding:9px 16px; cursor:pointer;
  }
  .btn:hover{opacity:.85;}
  .btn:active{opacity:.7;}
  .btn.ghost{ background:var(--panel-bg); color:var(--text); border:1px solid var(--border); }
  .btn.ghost:hover{border-color:var(--text);}
  .btn.solid-danger{ background:var(--bad); color:#fff; border:1px solid var(--bad); }
  .btn.solid-danger:hover{ opacity:.9; }
  .btn[disabled]{opacity:.4; cursor:not-allowed;}

  .pw-panel{margin-top:14px;}
  .pw-panel .label{font-size:12.5px;color:var(--muted);margin-bottom:8px;}
  .row-btns{margin-top:4px;}
  .msg{font-size:12.5px;margin-top:8px;min-height:16px;}
  .msg.bad{color:var(--bad);}
  .msg.good{color:var(--good);}
  .hint{font-size:12px;color:var(--muted);margin:14px 0 0;}

  /* ---------------- EDITOR ---------------- */
  #editor{ display:none; flex-direction:column; height:100vh; position:relative; }
  .titlebar{
    display:flex; align-items:center; justify-content:flex-start;
    padding:6px 10px; border-bottom:1px solid var(--border);
    font-size:12.5px; color:var(--muted); flex:none; gap:10px;
  }
  .titlebar .name{color:var(--text);font-weight:600;}
  .titlebar .path{
    flex:none; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; max-width:40vw;
  }

  .link-btn{
    background:none;border:none;cursor:pointer;
    font-family:inherit;font-size:12.5px;color:var(--muted); padding:6px 4px; text-align:left; width:100%;
    display:block;
  }
  .link-btn:hover{color:var(--text);}
  .link-btn.danger{color:var(--bad);}
  .link-btn.danger:hover{color:var(--bad);}

  /* responsividade da barra de título em telas pequenas */
  @media (max-width: 600px){
    .titlebar{ padding:6px 8px; gap:6px; }
    .titlebar .path{ max-width:28vw; font-size:11.5px; }
  }
  @media (max-width: 420px){
    .titlebar .path{ max-width:22vw; }
  }

  .icon-btn{
    flex:none; border:none; background:none; cursor:pointer; color:var(--muted);
    font-size:16px; padding:4px 6px; line-height:1; border-radius:4px;
  }
  .icon-btn:hover{ color:var(--text); }

  /* ---------------- barra de formatação de texto ---------------- */
  #formatToolbar{
    display:flex; align-items:center; flex-wrap:wrap;
    gap:4px; padding:6px 10px;
    border-bottom:1px solid var(--border);
    background:var(--panel-bg); flex:none;
  }
  .fmt-group{ display:flex; align-items:center; gap:2px; }
  .fmt-sep{ width:1px; align-self:stretch; background:var(--border); margin:2px 6px; }
  .fmt-btn{
    display:flex; align-items:center; justify-content:center;
    width:30px; height:28px; border:1px solid transparent; border-radius:4px;
    background:none; cursor:pointer; color:var(--text); padding:0;
  }
  .fmt-btn svg{ width:17px; height:17px; }
  .fmt-btn:hover{ background:var(--tab-bg); }
  .fmt-btn.active{ background:var(--tab-bg); border-color:var(--border); }
  .fmt-btn.fmt-text-glyph{ font-size:14px; font-family:Georgia, "Times New Roman", serif; }
  #fmtBold{ font-weight:700; }
  #fmtItalic{ font-style:italic; }
  #fmtStrike{ text-decoration:line-through; }
  .fmt-color-wrap{
    position:relative; display:flex; align-items:stretch;
    border-radius:4px; overflow:visible;
  }
  .fmt-color-wrap:hover{ background:var(--tab-bg); }
  .fmt-color-main{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; width:30px; height:28px; border:none; background:none; cursor:pointer;
    color:var(--text); padding:3px 0 4px;
  }
  .fmt-color-main svg{ width:15px; height:15px; }
  .fmt-color-main .fmt-ico{ font-size:13px; line-height:1; font-weight:700; }
  .fmt-swatch{ width:18px; height:3px; border-radius:1px; display:block; }
  .fmt-color-caret{
    width:13px; border:none; background:none; cursor:pointer;
    color:var(--muted); padding:0; font-size:9px; display:flex; align-items:center; justify-content:center;
  }
  .fmt-color-caret:hover{ color:var(--text); }
  .fmt-color-dropdown{
    display:none; position:absolute; top:32px; left:0;
    background:var(--panel-bg); border:1px solid var(--border); border-radius:4px;
    box-shadow:0 4px 14px rgba(0,0,0,0.08);
    padding:8px; z-index:20; grid-template-columns:repeat(4,1fr); gap:6px; width:132px;
  }
  .fmt-color-dropdown.open{ display:grid; }
  .fmt-color-dropdown button{
    width:24px; height:24px; border-radius:4px; border:1px solid var(--border); cursor:pointer; padding:0;
  }
  .fmt-color-dropdown button.fmt-none{
    display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--bad); background:var(--panel-bg);
  }
  @media (max-width: 600px){
    #formatToolbar{ padding:4px 6px; gap:2px; }
    .fmt-btn, .fmt-color-main{ width:26px; height:26px; }
    .fmt-sep{ margin:2px 3px; }
  }

  /* menu */
  .menu-wrap{ position:relative; flex:none; }
  .titlebar-menu{ margin-left:auto; }
  .fmt-menu-wrap{ position:relative; flex:none; display:flex; }
  #menuBtn{
    border:none; background:none; cursor:pointer; color:var(--muted);
    font-size:16px; padding:4px 8px; letter-spacing:2px;
  }
  #menuBtn:hover{ color:var(--text); }
  #menuDropdown{
    display:none; position:absolute; top:28px; right:0;
    background:var(--panel-bg); border:1px solid var(--border); border-radius:4px;
    box-shadow:0 4px 14px rgba(0,0,0,0.08);
    min-width:150px; padding:6px; z-index:20;
  }
  #menuDropdown.open{ display:block; }

  /* painel de emojis */
  #emojiDropdown{
    display:none; position:absolute; top:28px; right:0;
    background:var(--panel-bg); border:1px solid var(--border); border-radius:4px;
    box-shadow:0 4px 14px rgba(0,0,0,0.08);
    width:232px; max-height:220px; overflow-y:auto;
    padding:8px; z-index:20;
    grid-template-columns: repeat(7, 1fr);
    gap:2px;
  }
  #emojiDropdown.open{ display:grid; }
  #emojiDropdown button{
    border:none; background:none; cursor:pointer; font-size:18px;
    padding:4px 0; border-radius:4px; line-height:1.3;
  }
  #emojiDropdown button:hover{ background:var(--tab-bg); }

  /* tabs */
  #tabs{
    flex:none; display:flex; align-items:stretch; overflow-x:auto;
    background:var(--tab-bg); border-bottom:1px solid var(--border);
  }
  .tab{
    display:flex;align-items:center;gap:8px;
    padding:8px 10px 8px 14px; font-size:12.5px;
    border-right:1px solid var(--border); color:var(--muted);
    cursor:grab; white-space:nowrap; max-width:180px; background:var(--tab-bg);
    position:relative;
  }
  .tab.tab-dragging{
    cursor:grabbing; z-index:5; box-shadow:0 4px 14px rgba(0,0,0,0.25);
    background:var(--panel-bg);
  }
  .tab.drop-before{ box-shadow: inset 3px 0 0 var(--accent); }
  .tab.drop-after{ box-shadow: inset -3px 0 0 var(--accent); }
  .tab .t-title{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tab.active{ background:var(--panel-bg); color:var(--text); font-weight:600; box-shadow: inset 0 -2px 0 var(--accent); }
  .tab .x{ border:none;background:none;color:var(--muted); font-size:13px;line-height:1;cursor:pointer;padding:2px 4px;border-radius:2px; }
  .tab .x:hover{ color:var(--bad); background:rgba(194,59,59,0.1); }
  .tab-add{ flex:none; display:flex; align-items:center; justify-content:center; width:38px; color:var(--muted); cursor:pointer; font-size:16px; background:var(--tab-bg); }
  .tab-add:hover{ color:var(--text); }

  #content{
    flex:1; width:100%; outline:none; overflow-y:auto;
    padding:18px 22px;
    font-family: Consolas, "Courier New", monospace !important;
    font-size:14px !important; line-height:1.6; color:var(--text);
    white-space:pre-wrap; word-wrap:break-word;
    position:relative;
  }
  #content, #content *{
    font-family: Consolas, "Courier New", monospace !important;
    font-size:14px !important;
  }
  #content:empty:before{
    content: attr(data-placeholder);
    color:var(--placeholder);
  }

  /* fundo quadriculado (estilo "papel milimetrado"), opcional e bem sutil */
  #content.grid-bg{
    background-color: rgba(250, 248, 240, 0.12);
    background-image:
      linear-gradient(to right, rgba(120,120,120,0.07) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(120,120,120,0.07) 1px, transparent 1px);
    background-size: 22px 22px;
    background-attachment: local;
  }
  html.dark #content.grid-bg{
    background-color: rgba(244, 236, 210, 0.02);
    background-image:
      linear-gradient(to right, rgba(200,190,160,0.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(200,190,160,0.05) 1px, transparent 1px);
    background-size: 22px 22px;
  }
  #gridToggleBtn.active{ color:var(--accent); }
  #content mark, #content [style*="background-color"]{
    background-color:var(--hi);
    color:#1a1a1a;
  }

  /* imagens coladas: movíveis e redimensionáveis */
  #content .img-wrap{
    position:absolute;
    cursor:move;
    user-select:none;
    -webkit-user-select:none;
    line-height:0;
    z-index:1;
  }
  #content .img-wrap img{
    display:block; width:100%; height:auto;
    pointer-events:none;
    border-radius:2px;
  }
  #content .img-wrap .img-resize-handle{
    position:absolute; right:-7px; bottom:-7px;
    width:14px; height:14px; border-radius:50%;
    background:var(--accent); border:2px solid var(--bg);
    cursor:nwse-resize;
  }
  #content .img-wrap .img-delete-handle{
    position:absolute; top:-9px; right:-9px;
    width:20px; height:20px; border-radius:50%;
    background:var(--bad); border:2px solid var(--bg);
    color:#fff; font-size:13px; font-weight:700; line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  #content .img-wrap.dragging,
  #content .img-wrap.resizing{
    opacity:.85;
  }

  /* mapa mental: setas */
  #content.arrow-draw-mode{ cursor:crosshair; }
  #content .arrow-wrap{
    position:absolute; z-index:2; user-select:none; -webkit-user-select:none;
  }
  #content .arrow-wrap svg{ display:block; overflow:visible; }
  #content .arrow-wrap .arrow-hit{
    stroke:transparent; stroke-width:14; fill:none; cursor:move;
  }
  #content .arrow-wrap .arrow-line{
    stroke:var(--text); stroke-width:2; fill:none; pointer-events:none;
  }
  #content .arrow-wrap .arrow-handle{
    position:absolute; width:12px; height:12px; margin:-6px 0 0 -6px;
    border-radius:50%; background:var(--accent); border:2px solid var(--bg);
    cursor:pointer;
    opacity:0; transition:opacity .15s;
  }
  #content .arrow-wrap .arrow-delete{
    position:absolute; width:18px; height:18px; margin:-9px 0 0 -9px;
    border-radius:50%; background:var(--bad); border:2px solid var(--bg);
    color:#fff; font-size:12px; font-weight:700; line-height:1;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    opacity:0; transition:opacity .15s;
  }
  #content .arrow-wrap:hover .arrow-handle,
  #content .arrow-wrap:hover .arrow-delete,
  #content .arrow-wrap.dragging .arrow-handle,
  #content .arrow-wrap.resizing .arrow-handle{ opacity:1; }
  #content .arrow-wrap.dragging .arrow-line,
  #content .arrow-wrap.dragging .arrow-hit{ opacity:.7; }

  /* mapa mental: caixas de texto */
  #content .textbox-wrap{
    position:absolute; z-index:2; cursor:move;
    background:#faf6ec; border:1.5px solid #1a1a1a; border-radius:4px;
    padding:12px 16px; min-width:70px; min-height:24px;
    box-shadow:0 1px 4px rgba(0,0,0,0.08);
  }
  html.dark #content .textbox-wrap{
    background:#f4ecd2; border-color:#1a1a1a;
  }
  #content .textbox-wrap .textbox-content{
    text-align:center; outline:none; cursor:text; color:#1a1a1a;
    min-width:40px; min-height:1.4em; white-space:pre-wrap; word-break:break-word;
  }
  #content .textbox-wrap .textbox-content:empty:before{
    content: attr(data-placeholder); color:#999;
  }
  #content .textbox-resize-handle{
    position:absolute; right:-7px; bottom:-7px;
    width:14px; height:14px; border-radius:50%;
    background:var(--accent); border:2px solid var(--bg);
    cursor:nwse-resize;
  }
  #content .textbox-delete-handle{
    position:absolute; top:-9px; right:-9px;
    width:20px; height:20px; border-radius:50%;
    background:var(--bad); border:2px solid var(--bg);
    color:#fff; font-size:13px; font-weight:700; line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; opacity:0; transition:opacity .15s;
  }
  #content .textbox-wrap:hover .textbox-delete-handle,
  #content .textbox-wrap:hover .textbox-resize-handle{ opacity:1; }
  #content .textbox-resize-handle{ opacity:0; transition:opacity .15s; }
  #content .textbox-wrap.dragging,
  #content .textbox-wrap.resizing{ opacity:.85; }

  .statusbar{
    flex:none; display:flex; justify-content:space-between; align-items:center;
    padding:6px 12px; border-top:1px solid var(--border);
    font-size:11.5px; color:var(--muted);
  }
  .statusbar .left-group{ display:flex; align-items:center; gap:8px; }
  #appVersion{ opacity:.45; font-size:11px; }

  #changePwPanel{ display:none; flex:none; border-top:1px solid var(--border); padding:14px 22px; }
  #changePwPanel .label{font-size:12.5px;color:var(--muted);margin-bottom:8px;}
  #changePwPanel input{max-width:220px;display:inline-block;margin-right:8px;}

  /* custom confirm/info modal (window.confirm/alert are blocked inside this sandbox) */
  .overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.35);
    align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .overlay.open{ display:flex; }
  .overlay-box{
    background:var(--panel-bg); border-radius:6px; max-width:340px; width:100%;
    padding:20px; box-shadow:0 10px 30px rgba(0,0,0,0.2);
  }
  .overlay-box p{ margin:0 0 18px; font-size:13.5px; color:var(--text); line-height:1.5; }
  .overlay-actions{ display:flex; justify-content:flex-end; gap:8px; }

  /* ---------------- TOUR GUIADO ---------------- */
  #tourRoot{ display:none; }
  #tourRoot.open{ display:block; }
  #tourBackdrop{
    position:fixed; inset:0; z-index:300;
    background:rgba(20,20,20,0.45);
    -webkit-backdrop-filter:blur(4px);
    backdrop-filter:blur(4px);
    transition:clip-path .25s ease;
  }
  #tourRing{
    position:fixed; z-index:301; pointer-events:none;
    border:2px solid #fff; border-radius:10px;
    box-shadow:0 0 0 3px rgba(47,111,237,0.55), 0 4px 18px rgba(0,0,0,0.3);
    transition:top .25s ease, left .25s ease, width .25s ease, height .25s ease;
  }
  #tourPopup{
    position:fixed; z-index:302; width:270px; max-width:calc(100vw - 20px);
    background:var(--panel-bg); border-radius:8px; padding:16px;
    box-shadow:0 12px 30px rgba(0,0,0,0.3);
    transition:top .25s ease, left .25s ease;
  }
  #tourStepLabel{
    font-size:10.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
    color:var(--accent); margin-bottom:6px;
  }
  #tourTitle{ font-size:14.5px; font-weight:700; color:var(--text); margin-bottom:6px; }
  #tourText{ font-size:12.5px; color:var(--text); line-height:1.55; margin-bottom:16px; }
  .tour-actions{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  #tourSkipBtn{
    background:none; border:none; cursor:pointer; font-family:inherit;
    font-size:12px; color:var(--muted); padding:6px 2px;
  }
  #tourSkipBtn:hover{ color:var(--text); text-decoration:underline; }
  #tourNextBtn{
    font-family:inherit; font-size:12.5px; font-weight:600;
    border:1px solid var(--text); background:var(--text); color:#fff;
    border-radius:4px; padding:8px 16px; cursor:pointer; flex:none;
  }
  #tourNextBtn:hover{ opacity:.85; }
</style>
</head>
<body>

  <!-- GATE -->
  <div id="gate">
    <div class="gate-box">
      <p class="gate-title">Abrir ou criar sua página</p>
      <div class="url-row">
        <span class="prefix">bloco.app/</span>
        <input id="slugInput" type="text" placeholder="seu-nome" autocomplete="off" spellcheck="false">
      </div>
      <button class="btn" id="goBtn">Abrir</button>

      <div id="pwPanel" class="pw-panel"></div>
      <div id="gateMsg" class="msg"></div>
      <p class="hint">Novo nome → você cria uma senha. Nome existente → digite a senha para desbloquear.</p>
    </div>
  </div>

  <!-- EDITOR -->
  <div id="editor">
    <div class="titlebar">
      <div class="path">bloco.app/<span class="name" id="slugLabel"></span></div>

      <div class="menu-wrap titlebar-menu">
        <button id="menuBtn" title="Mais opções">⋮</button>
        <div id="menuDropdown">
          <button class="link-btn" id="startTourBtn">Como usar o site</button>
          <button class="link-btn" id="togglePwBtn">Trocar senha</button>
          <button class="link-btn danger" id="deleteAccountBtn">Excluir conta</button>
          <button class="link-btn" id="exitBtn">Sair</button>
        </div>
      </div>
    </div>

    <div id="tabs"></div>

    <div id="formatToolbar">
      <div class="fmt-group">
        <button class="fmt-btn" id="fmtUl" title="Lista com marcadores">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <circle cx="3" cy="5" r="1.1" fill="currentColor" stroke="none"/>
            <circle cx="3" cy="10" r="1.1" fill="currentColor" stroke="none"/>
            <circle cx="3" cy="15" r="1.1" fill="currentColor" stroke="none"/>
            <line x1="7" y1="5" x2="17" y2="5"/>
            <line x1="7" y1="10" x2="17" y2="10"/>
            <line x1="7" y1="15" x2="17" y2="15"/>
          </svg>

async function deriveKey(password, saltBytes){
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt: saltBytes, iterations: 120000, hash:'SHA-256' },
    baseKey, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']
  );
}
async function encryptPayload(obj, password){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(password, salt);
  const enc = new TextEncoder();
  const cipher = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(JSON.stringify(obj)));
  return { payload: JSON.stringify({ s: b64(salt), i: b64(iv), c: b64(cipher) }), key };
}
async function decryptPayload(payloadStr, password){
  const { s, i, c } = JSON.parse(payloadStr);
  const salt = unb64(s), iv = unb64(i), cipher = unb64(c);
  const key = await deriveKey(password, salt);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, cipher);
  const text = new TextDecoder().decode(plain);
  let obj;
  try{ obj = JSON.parse(text); }catch(e){ obj = { pages: [{ id:newId(), content:text }] }; }
  if(!obj.pages || !obj.pages.length) obj.pages = [{ id:newId(), content:'' }];
  return { obj, key };
}
async function reencryptWithKey(obj, key, salt, iv){
  const enc = new TextEncoder();
  const cipher = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(JSON.stringify(obj)));
  return JSON.stringify({ s: b64(salt), i: b64(iv), c: b64(cipher) });
}

/* ---- arrastar abas para reordenar as páginas ----
   A aba arrastada segue o ponteiro visualmente (transform), enquanto um
   indicador mostra onde ela vai encaixar; a ordem só é aplicada ao soltar. */
let tabDragJustEnded = false;
function setupTabDrag(tabEl, pageId){
  let startX, startY, pointerId, dragging = false;
  let dropTargetEl = null, dropBefore = true;

  tabEl.addEventListener('pointerdown', (e) => {
    if(e.target.closest('.x')) return;
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    startX = e.clientX; startY = e.clientY;
    pointerId = e.pointerId;
    dragging = false;
    dropTargetEl = null;
    tabEl.addEventListener('pointermove', onMove);
    tabEl.addEventListener('pointerup', onUp);
    tabEl.addEventListener('pointercancel', onUp);
  });

  function clearIndicator(){
    if(dropTargetEl){
      dropTargetEl.classList.remove('drop-before', 'drop-after');
      dropTargetEl = null;
    }
  }

  function onMove(e){
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if(!dragging){
      if(Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
      dragging = true;
      try{ tabEl.setPointerCapture(pointerId); }catch(err){}
      tabEl.classList.add('tab-dragging');
      tabEl.style.touchAction = 'none';
      tabEl.style.pointerEvents = 'none'; // deixa o hit-test "enxergar" as abas por baixo
    }
    e.preventDefault();
    tabEl.style.transform = `translateX(${dx}px)`;

    const el = document.elementFromPoint(e.clientX, e.clientY);
    const targetTab = el ? el.closest('.tab') : null;
    clearIndicator();
    if(targetTab && targetTab !== tabEl && tabsEl.contains(targetTab)){
      const rect = targetTab.getBoundingClientRect();
      dropBefore = e.clientX < rect.left + rect.width / 2;
      targetTab.classList.add(dropBefore ? 'drop-before' : 'drop-after');
      dropTargetEl = targetTab;
    }
  }

  function onUp(){
    tabEl.removeEventListener('pointermove', onMove);
    tabEl.removeEventListener('pointerup', onUp);
    tabEl.removeEventListener('pointercancel', onUp);
    if(dragging){
      tabEl.classList.remove('tab-dragging');
      tabEl.style.transform = '';
      tabEl.style.touchAction = '';
      tabEl.style.pointerEvents = '';
      if(dropTargetEl){
        const targetId = dropTargetEl.dataset.id;
        const fromIdx = pages.findIndex(p => p.id === pageId);
        if(fromIdx !== -1){
          const [moved] = pages.splice(fromIdx, 1);
          let toIdx = pages.findIndex(p => p.id === targetId);
          if(toIdx === -1) toIdx = pages.length;
          else if(!dropBefore) toIdx += 1;
          pages.splice(toIdx, 0, moved);
        }
      }
      clearIndicator();
      tabDragJustEnded = true;
      renderTabs();
      scheduleAutosave();
    }
    dragging = false;
  }
}

function switchToPage(id){

function syncActiveContentFromEditor(){

function addPage(){
  syncActiveContentFromEditor();

async function deletePage(id){
  if(pages.length && pages[0].id === id){
    await askAlert('A primeira página não pode ser excluída.');
    return;
  }
  if(pages.length === 1){
    await askAlert('Precisa ter pelo menos uma página. Escreva algo novo em vez de excluir.');
    return;
  }
  const page = pages.find(p => p.id === id);
  const label = titleFor(page);
  const ok = await askConfirm(`Tem certeza que quer excluir a página "${label}"? Essa ação não pode ser desfeita.`, 'Excluir página');
  if(!ok) return;
  const idx = pages.findIndex(p => p.id === id);
  pages.splice(idx, 1);
  if(activePageId === id){
    const next = pages[Math.max(0, idx - 1)];
    activePageId = next.id;
    contentEl.innerHTML = next.content;
    reattachContentImages();
  }
  renderTabs();
  scheduleAutosave();
}

function openEditor(){
  gate.style.display = 'none';

  const active = pages.find(p => p.id === activePageId);

  reattachContentImages();
  saveStatus.textContent = 'tudo salvo';
  changePwPanel.style.display = 'none';
  renderTabs();

}

function scheduleAutosave(){
  saveStatus.textContent = 'alterações não salvas';
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(doAutosave, 800);
}
/* substitui "->" por uma seta de verdade (➞) assim que o usuário termina de digitá-la */
function tryArrowShortcut(e){
  if(!(e.inputType === 'insertText' && e.data === '>')) return;
  const sel = window.getSelection();
  if(!sel || !sel.isCollapsed || sel.rangeCount === 0) return;
  const node = sel.anchorNode;
  const offset = sel.anchorOffset;
  if(!node || node.nodeType !== Node.TEXT_NODE) return;
  if(offset < 2) return;
  if(node.data.slice(offset - 2, offset) !== '->') return;
  const range = document.createRange();
  range.setStart(node, offset - 2);
  range.setEnd(node, offset);
  sel.removeAllRanges();
  sel.addRange(range);
  document.execCommand('insertText', false, '⇨');
}
contentEl.addEventListener('input', tryArrowShortcut);

contentEl.addEventListener('input', () => {
  syncActiveContentFromEditor();
  renderTabs();

});
async function doAutosave(){
  syncActiveContentFromEditor();
  saveStatus.textContent = 'salvando…';
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const payload = await reencryptWithKey({ pages, activePageId }, currentKey, sessionSalt, iv);
  try{
    await storage.set(keyFor(currentSlug), payload);
    saveStatus.textContent = 'tudo salvo · ' + new Date().toLocaleTimeString();
  }catch(e){ saveStatus.textContent = 'erro ao salvar'; }
}

function fmtExec(cmd, value){
  contentEl.focus();
  document.execCommand(cmd, false, value === undefined ? null : value);
  syncActiveContentFromEditor();
  renderTabs();
  scheduleAutosave();
  updateFmtActiveStates();
}

function setCurrentListStyle(type){
  const sel = window.getSelection();
  if(!sel || sel.rangeCount === 0) return;
  let node = sel.getRangeAt(0).startContainer;
  while(node && node !== contentEl){
    if(node.nodeName === 'OL'){ node.style.listStyleType = type; break; }
    node = node.parentNode;
  }
}

/* ---------------------------------------------------------------
   COLAR TEXTO: sempre com a fonte/tamanho padrão do bloco
   (mantém apenas negrito e marca-texto, ignora fonte, tamanho,
   cor e qualquer outra formatação vinda de fora)
--------------------------------------------------------------- */
const BLOCK_TAGS = new Set(['P','DIV','LI','TR','H1','H2','H3','H4','H5','H6','BLOCKQUOTE']);

function isHighlighted(node){
  const bg = node.style && node.style.backgroundColor;
  return node.tagName === 'MARK' || (bg && bg !== '' && bg !== 'transparent' && bg !== 'rgba(0, 0, 0, 0)');
}
function isBold(node){
  if(node.tagName === 'B' || node.tagName === 'STRONG') return true;
  const w = node.style && node.style.fontWeight;
  if(!w) return false;
  const n = parseInt(w, 10);
  return w === 'bold' || (!isNaN(n) && n >= 600);
}

function sanitizeIntoFragment(srcParent, destParent){
  srcParent.childNodes.forEach(node => {
    if(node.nodeType === Node.TEXT_NODE){
      destParent.appendChild(document.createTextNode(node.textContent));
      return;
    }
    if(node.nodeType !== Node.ELEMENT_NODE) return;
    const tag = node.tagName;
    if(tag === 'IMG' || tag === 'SCRIPT' || tag === 'STYLE') return; // imagens coladas via HTML são ignoradas (usamos o arquivo real do clipboard)
    if(tag === 'BR'){ destParent.appendChild(document.createElement('br')); return; }

    let wrapper = destParent;
    if(isHighlighted(node)){
      wrapper = document.createElement('mark');
      destParent.appendChild(wrapper);
    }else if(isBold(node)){
      wrapper = document.createElement('b');
      destParent.appendChild(wrapper);
    }
    sanitizeIntoFragment(node, wrapper);

    if(BLOCK_TAGS.has(tag) && node.nextSibling){
      destParent.appendChild(document.createElement('br'));
    }
  });
}

function sanitizePastedHtml(html){
  const src = document.createElement('div');
  src.innerHTML = html;
  const out = document.createElement('div');
  sanitizeIntoFragment(src, out);
  return out.innerHTML;
}

/* ---------------------------------------------------------------
   COLAR IMAGEM: insere como bloco movível e redimensionável
--------------------------------------------------------------- */
function makeImageInteractive(wrap){
  const handle = wrap.querySelector('.img-resize-handle');
  const deleteHandle = wrap.querySelector('.img-delete-handle');
  const img = wrap.querySelector('img');

  if(deleteHandle){
    deleteHandle.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); });
    deleteHandle.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      wrap.remove();
      syncActiveContentFromEditor();
      renderTabs();
      scheduleAutosave();
    });
  }

  wrap.addEventListener('pointerdown', (e) => {
    if(e.target === handle || e.target === deleteHandle) return;
    e.preventDefault();
    wrap.classList.add('dragging');
    const contentRect = contentEl.getBoundingClientRect();
    const startLeft = parseFloat(wrap.style.left) || 0;
    const startTop = parseFloat(wrap.style.top) || 0;
    const startX = e.clientX, startY = e.clientY;
    wrap.setPointerCapture(e.pointerId);
    function onMove(ev){
      const dx = ev.clientX - startX, dy = ev.clientY - startY;
      let left = startLeft + dx;
      let top = startTop + dy;
      left = Math.max(0, Math.min(left, contentEl.scrollWidth - 20));
      top = Math.max(0, top);
      wrap.style.left = left + 'px';
      wrap.style.top = top + 'px';
    }
    function onUp(ev){
      wrap.classList.remove('dragging');
      wrap.removeEventListener('pointermove', onMove);
      wrap.removeEventListener('pointerup', onUp);
      syncActiveContentFromEditor();
      scheduleAutosave();
    }
    wrap.addEventListener('pointermove', onMove);
    wrap.addEventListener('pointerup', onUp);
  });

  handle.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    e.stopPropagation();
    wrap.classList.add('resizing');
    const startWidth = wrap.offsetWidth;
    const startX = e.clientX;
    handle.setPointerCapture(e.pointerId);
    function onMove(ev){
      const dx = ev.clientX - startX;
      let newWidth = startWidth + dx;
      newWidth = Math.max(40, Math.min(newWidth, Math.max(contentEl.clientWidth - 20, 40)));
      wrap.style.width = newWidth + 'px';
    }
    function onUp(ev){
      wrap.classList.remove('resizing');
      handle.removeEventListener('pointermove', onMove);
      handle.removeEventListener('pointerup', onUp);
      syncActiveContentFromEditor();
      scheduleAutosave();
    }
    handle.addEventListener('pointermove', onMove);
    handle.addEventListener('pointerup', onUp);
  });
}

function reattachContentImages(){
  contentEl.querySelectorAll('.img-wrap').forEach(makeImageInteractive);
  contentEl.querySelectorAll('.arrow-wrap').forEach(makeArrowInteractive);
  contentEl.querySelectorAll('.textbox-wrap').forEach(makeTextboxInteractive);
}

/* ---------------- MAPA MENTAL: SETAS ---------------- */
let arrowCounter = 0;
const ARROW_PAD = 14;

function contentPoint(e){
  const rect = contentEl.getBoundingClientRect();
  return {
    x: e.clientX - rect.left + contentEl.scrollLeft,
    y: e.clientY - rect.top + contentEl.scrollTop
  };
}

function arrowMarkerId(wrap){ return 'arrowhead_' + wrap.dataset.aid; }

function positionArrowWrap(wrap){
  const x1 = parseFloat(wrap.dataset.x1), y1 = parseFloat(wrap.dataset.y1);
  const x2 = parseFloat(wrap.dataset.x2), y2 = parseFloat(wrap.dataset.y2);
  const minX = Math.min(x1, x2) - ARROW_PAD, minY = Math.min(y1, y2) - ARROW_PAD;
  const w = Math.abs(x2 - x1) + ARROW_PAD * 2, h = Math.abs(y2 - y1) + ARROW_PAD * 2;
  wrap.style.left = minX + 'px';
  wrap.style.top = minY + 'px';
  wrap.style.width = w + 'px';
  wrap.style.height = h + 'px';

  const svg = wrap.querySelector('svg');
  svg.setAttribute('width', w); svg.setAttribute('height', h);
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  const lx1 = x1 - minX, ly1 = y1 - minY, lx2 = x2 - minX, ly2 = y2 - minY;
  const line = wrap.querySelector('.arrow-line');
  const hit = wrap.querySelector('.arrow-hit');
  [line, hit].forEach(el => {
    el.setAttribute('x1', lx1); el.setAttribute('y1', ly1);
    el.setAttribute('x2', lx2); el.setAttribute('y2', ly2);
  });
  const handle1 = wrap.querySelector('.arrow-handle.a1');
  const handle2 = wrap.querySelector('.arrow-handle.a2');
  handle1.style.left = lx1 + 'px'; handle1.style.top = ly1 + 'px';
  handle2.style.left = lx2 + 'px'; handle2.style.top = ly2 + 'px';
  const del = wrap.querySelector('.arrow-delete');
  del.style.left = ((lx1 + lx2) / 2) + 'px';
  del.style.top = ((ly1 + ly2) / 2) + 'px';
}

function makeArrowInteractive(wrap){
  const hit = wrap.querySelector('.arrow-hit');
  const handle1 = wrap.querySelector('.arrow-handle.a1');
  const handle2 = wrap.querySelector('.arrow-handle.a2');
  const del = wrap.querySelector('.arrow-delete');

  del.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); });
  del.addEventListener('click', (e) => {
    e.preventDefault(); e.stopPropagation();
    wrap.remove();
    syncActiveContentFromEditor();
    renderTabs();
    scheduleAutosave();
  });

  function dragEndpoint(which){
    return (e) => {
      e.preventDefault(); e.stopPropagation();
      wrap.classList.add('resizing');
      wrap.setPointerCapture(e.pointerId);
      function onMove(ev){
        const p = contentPoint(ev);
        wrap.dataset['x' + which] = p.x;
        wrap.dataset['y' + which] = p.y;
        positionArrowWrap(wrap);
      }
      function onUp(){
        wrap.classList.remove('resizing');
        wrap.removeEventListener('pointermove', onMove);
        wrap.removeEventListener('pointerup', onUp);
        syncActiveContentFromEditor();
        scheduleAutosave();
      }
      wrap.addEventListener('pointermove', onMove);
      wrap.addEventListener('pointerup', onUp);
    };
  }
  handle1.addEventListener('pointerdown', dragEndpoint(1));
  handle2.addEventListener('pointerdown', dragEndpoint(2));

  hit.addEventListener('pointerdown', (e) => {
    e.preventDefault(); e.stopPropagation();
    wrap.classList.add('dragging');
    const startX1 = parseFloat(wrap.dataset.x1), startY1 = parseFloat(wrap.dataset.y1);
    const startX2 = parseFloat(wrap.dataset.x2), startY2 = parseFloat(wrap.dataset.y2);
    const startP = contentPoint(e);
    wrap.setPointerCapture(e.pointerId);
    function onMove(ev){
      const p = contentPoint(ev);
      const dx = p.x - startP.x, dy = p.y - startP.y;
      wrap.dataset.x1 = startX1 + dx; wrap.dataset.y1 = startY1 + dy;
      wrap.dataset.x2 = startX2 + dx; wrap.dataset.y2 = startY2 + dy;
      positionArrowWrap(wrap);
    }
    function onUp(){
      wrap.classList.remove('dragging');
      wrap.removeEventListener('pointermove', onMove);
      wrap.removeEventListener('pointerup', onUp);
      syncActiveContentFromEditor();
      scheduleAutosave();
    }
    wrap.addEventListener('pointermove', onMove);
    wrap.addEventListener('pointerup', onUp);
  });
}

function buildArrowWrap(x1, y1, x2, y2){
  const wrap = document.createElement('div');
  wrap.className = 'arrow-wrap';
  wrap.contentEditable = 'false';
  wrap.dataset.aid = String(arrowCounter++);
  wrap.dataset.x1 = x1; wrap.dataset.y1 = y1; wrap.dataset.x2 = x2; wrap.dataset.y2 = y2;
  const mid = arrowMarkerId(wrap);
  wrap.innerHTML = `
    <svg xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="${mid}" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
          <path d="M0,0 L10,5 L0,10 Z" fill="currentColor" style="color:var(--text);"></path>
        </marker>
      </defs>
      <line class="arrow-hit"></line>
      <line class="arrow-line" marker-end="url(#${mid})"></line>
    </svg>
    <div class="arrow-handle a1"></div>
    <div class="arrow-handle a2"></div>
    <div class="arrow-delete" title="Excluir seta">×</div>
  `;
  contentEl.appendChild(wrap);
  positionArrowWrap(wrap);
  makeArrowInteractive(wrap);
  return wrap;
}

function startArrowDrawMode(){
  contentEl.classList.add('arrow-draw-mode');

  function onDown(e){
    if(e.target.closest('.arrow-wrap') || e.target.closest('.img-wrap') || e.target.closest('.textbox-wrap')) return;
    e.preventDefault();
    contentEl.removeEventListener('pointerdown', onDown, true);
    contentEl.classList.remove('arrow-draw-mode');
    trackContentPointer(e);
    // usa a posição já normalizada (com rolagem) para garantir início exato na ponta do ponteiro
    const start = { x: lastContentPointer.x, y: lastContentPointer.y };
    const wrap = buildArrowWrap(start.x, start.y, start.x, start.y);
    wrap.classList.add('dragging'); // mostra a alça inicial para feedback visual imediato
    contentEl.setPointerCapture(e.pointerId);
    function onMove(ev){
      const p = contentPoint(ev);
      wrap.dataset.x2 = p.x; wrap.dataset.y2 = p.y;
      positionArrowWrap(wrap);
    }
    function onUp(){
      wrap.classList.remove('dragging');
      contentEl.removeEventListener('pointermove', onMove);
      contentEl.removeEventListener('pointerup', onUp);
      syncActiveContentFromEditor();
      renderTabs();
      scheduleAutosave();
    }
    contentEl.addEventListener('pointermove', onMove);
    contentEl.addEventListener('pointerup', onUp);
  }
  contentEl.addEventListener('pointerdown', onDown, true);
}

/* ---------------- MAPA MENTAL: CAIXAS DE TEXTO ---------------- */
function makeTextboxInteractive(wrap){
  const handle = wrap.querySelector('.textbox-resize-handle');
  const del = wrap.querySelector('.textbox-delete-handle');
  const inner = wrap.querySelector('.textbox-content');

  del.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); });
  del.addEventListener('click', (e) => {
    e.preventDefault(); e.stopPropagation();
    wrap.remove();
    syncActiveContentFromEditor();
    renderTabs();
    scheduleAutosave();
  });

  inner.addEventListener('input', () => {
    syncActiveContentFromEditor();
    scheduleAutosave();
  });

  wrap.addEventListener('pointerdown', (e) => {
    if(e.target !== wrap) return;
    e.preventDefault();
    wrap.classList.add('dragging');
    const contentRect = contentEl.getBoundingClientRect();
    const startLeft = parseFloat(wrap.style.left) || 0;
    const startTop = parseFloat(wrap.style.top) || 0;
    const startX = e.clientX, startY = e.clientY;
    wrap.setPointerCapture(e.pointerId);
    function onMove(ev){
      const dx = ev.clientX - startX, dy = ev.clientY - startY;
      let left = startLeft + dx;
      let top = startTop + dy;
      left = Math.max(0, left);
      top = Math.max(0, top);
      wrap.style.left = left + 'px';
      wrap.style.top = top + 'px';
    }
    function onUp(){
      wrap.classList.remove('dragging');
      wrap.removeEventListener('pointermove', onMove);
      wrap.removeEventListener('pointerup', onUp);
      syncActiveContentFromEditor();
      scheduleAutosave();
    }
    wrap.addEventListener('pointermove', onMove);
    wrap.addEventListener('pointerup', onUp);
  });

  handle.addEventListener('pointerdown', (e) => {
    e.preventDefault(); e.stopPropagation();
    wrap.classList.add('resizing');
    const startWidth = wrap.offsetWidth;
    const startX = e.clientX;
    handle.setPointerCapture(e.pointerId);
    function onMove(ev){
      const dx = ev.clientX - startX;
      let newWidth = startWidth + dx;
      newWidth = Math.max(70, newWidth);
      wrap.style.width = newWidth + 'px';
    }
    function onUp(){
      wrap.classList.remove('resizing');
      handle.removeEventListener('pointermove', onMove);
      handle.removeEventListener('pointerup', onUp);
      syncActiveContentFromEditor();
      scheduleAutosave();
    }
    handle.addEventListener('pointermove', onMove);
    handle.addEventListener('pointerup', onUp);
  });
}

function startTextBoxPlaceMode(){
  contentEl.classList.add('arrow-draw-mode'); // reaproveita o cursor de mira (crosshair)

  function onDown(e){
    if(e.target.closest('.arrow-wrap') || e.target.closest('.img-wrap') || e.target.closest('.textbox-wrap')) return;
    e.preventDefault();
    contentEl.removeEventListener('pointerdown', onDown, true);
    contentEl.classList.remove('arrow-draw-mode');
    trackContentPointer(e);
    insertTextBox({ x: lastContentPointer.x, y: lastContentPointer.y });
  }
  contentEl.addEventListener('pointerdown', onDown, true);
}

function insertTextBox(point){
  const wrap = document.createElement('div');
  wrap.className = 'textbox-wrap';
  wrap.contentEditable = 'false';
  const boxWidth = 160;
  let left, top;
  if(point){
    // nasce exatamente onde o usuário clicou
    left = Math.max(0, point.x);
    top = Math.max(0, point.y);
  }else{
    // sem ponto de clique informado (ex.: ativado por teclado): usa um ponto visível na área atual
    const offset = contentEl.querySelectorAll('.textbox-wrap, .arrow-wrap, .img-wrap').length * 16 % 120;
    left = 40 + offset;
    top = contentEl.scrollTop + 40 + offset;
  }
  wrap.style.left = left + 'px';
  wrap.style.top = top + 'px';
  wrap.style.width = boxWidth + 'px';

  const inner = document.createElement('div');
  inner.className = 'textbox-content';
  inner.contentEditable = 'true';
  inner.dataset.placeholder = 'Digite aqui...';

  const handle = document.createElement('div');
  handle.className = 'textbox-resize-handle';

  const del = document.createElement('div');
  del.className = 'textbox-delete-handle';
  del.title = 'Excluir caixa';
  del.textContent = '×';

  wrap.appendChild(inner);
  wrap.appendChild(handle);
  wrap.appendChild(del);
  contentEl.appendChild(wrap);
  makeTextboxInteractive(wrap);

  syncActiveContentFromEditor();
  renderTabs();
  scheduleAutosave();

  inner.focus();
}

function insertImageWrap(dataUrl){
  const wrap = document.createElement('div');
  wrap.className = 'img-wrap';
  wrap.contentEditable = 'false';
  const offset = contentEl.querySelectorAll('.img-wrap').length * 16;
  wrap.style.left = (20 + offset) + 'px';
  wrap.style.top = (contentEl.scrollTop + 20 + offset) + 'px';
  wrap.style.width = '220px';

  const img = document.createElement('img');
  img.src = dataUrl;
  img.draggable = false;
  img.alt = 'imagem colada';

  const handle = document.createElement('div');
  handle.className = 'img-resize-handle';

  const deleteHandle = document.createElement('div');
  deleteHandle.className = 'img-delete-handle';
  deleteHandle.title = 'Excluir imagem';
  deleteHandle.textContent = '×';

  wrap.appendChild(img);
  wrap.appendChild(handle);
  wrap.appendChild(deleteHandle);
  contentEl.appendChild(wrap);
  makeImageInteractive(wrap);

  syncActiveContentFromEditor();
  renderTabs();
  scheduleAutosave();
}

function insertImageFile(file){
  const reader = new FileReader();
  reader.onload = (ev) => insertImageWrap(ev.target.result);
  reader.readAsDataURL(file);
}

/* ---------------------------------------------------------------
   Handler de colar: imagem -> bloco movível; texto -> texto puro
   no padrão do bloco (sem fonte/tamanho/cor externos)
--------------------------------------------------------------- */
contentEl.addEventListener('paste', (e) => {
  const dt = e.clipboardData || window.clipboardData;
  if(!dt) return;
  e.preventDefault();

  let imageFile = null;
  if(dt.files && dt.files.length){
    for(const f of dt.files){ if(f.type && f.type.startsWith('image/')){ imageFile = f; break; } }
  }
  if(!imageFile && dt.items){
    for(const it of dt.items){
      if(it.kind === 'file' && it.type && it.type.startsWith('image/')){ imageFile = it.getAsFile(); break; }
    }
  }
  if(imageFile){ insertImageFile(imageFile); return; }

  const html = dt.getData('text/html');
  if(html && html.trim()){
    const clean = sanitizePastedHtml(html);
    document.execCommand('insertHTML', false, clean);
  }else{
    const text = dt.getData('text/plain');
    if(text) document.execCommand('insertText', false, text);
  }
  syncActiveContentFromEditor();
  renderTabs();
  scheduleAutosave();
});

/* ---- tour guiado (primeira experiência) ---- */
const tourSteps = [
  {
    selector: '#content',
    title: 'Sua página',
    text: 'Aqui é onde você escreve. A primeira palavra que você digitar vira automaticamente o título desta página.'
  },
  {
    selector: '.tab-add',
    title: 'Várias páginas',
    text: 'Clique no + para criar uma nova página. Cada uma vira uma aba aqui em cima, e você pode alternar entre elas quando quiser.'
  },
  {
    selector: '#menuBtn',
    title: 'Mais opções',
    text: 'Aqui você troca sua senha, sai da conta ou exclui tudo, se um dia precisar.'
  },
  {
    selector: '.statusbar',
    title: 'Salvamento automático',
    text: 'Tudo que você escreve é salvo sozinho, poucos instantes depois de parar de digitar. Não precisa clicar em nada.'
  }
];
let tourIndex = 0;
let tourActive = false;

function maybeStartTour(){
  let done = '0';
  try{ done = localStorage.getItem('blocoTourDone') || '0'; }catch(e){}
  if(done === '1') return;
  setTimeout(startTour, 500);
}

function startTour(){
  menuDropdown.classList.remove('open');
  tourIndex = 0;
  tourActive = true;
  tourRoot.classList.add('open');
  showTourStep();
  window.addEventListener('resize', onTourReposition);
  window.addEventListener('scroll', onTourReposition, true);
}

function onTourReposition(){
  if(!tourActive) return;
  positionTourFor(tourSteps[tourIndex].selector);
}

function endTour(){
  tourActive = false;
  tourRoot.classList.remove('open');
  window.removeEventListener('resize', onTourReposition);
  window.removeEventListener('scroll', onTourReposition, true);
  try{ localStorage.setItem('blocoTourDone', '1'); }catch(e){}
}

function showTourStep(){
  const step = tourSteps[tourIndex];
  const target = document.querySelector(step.selector);
  if(!target){ nextTourStep(); return; }
  tourStepLabel.textContent = 'Passo ' + (tourIndex+1) + ' de ' + tourSteps.length;
  tourTitle.textContent = step.title;
  tourText.textContent = step.text;
  tourNextBtn.textContent = (tourIndex === tourSteps.length - 1) ? 'Concluir' : 'Próximo';
  positionTourFor(step.selector);
}

function positionTourFor(selector){
  const target = document.querySelector(selector);
  if(!target) return;
  const rect = target.getBoundingClientRect();
  const pad = 8;
  const W = window.innerWidth, H = window.innerHeight;
  const x = Math.max(4, rect.left - pad);
  const y = Math.max(4, rect.top - pad);
  const w = Math.min(W - x - 4, rect.width + pad*2);
  const h = Math.min(H - y - 4, rect.height + pad*2);

  // recorta o fundo desfocado deixando um "buraco" nítido sobre o alvo
  const d = `M0,0 H${W} V${H} H0 Z M${x},${y} H${x+w} V${y+h} H${x} Z`;
  tourClipPathShape.setAttribute('d', d);

  tourRing.style.left = x + 'px';
  tourRing.style.top = y + 'px';
  tourRing.style.width = w + 'px';
  tourRing.style.height = h + 'px';

  // posiciona o popup embaixo do alvo; se não couber, coloca em cima
  const popupWidth = 270;
  const estimatedPopupHeight = tourPopup.offsetHeight || 150;
  let popTop = y + h + 14;
  if(popTop + estimatedPopupHeight > H - 10){
    popTop = Math.max(10, y - estimatedPopupHeight - 14);
  }
  let popLeft = x;
  if(popLeft + popupWidth > W - 10) popLeft = W - popupWidth - 10;
  if(popLeft < 10) popLeft = 10;
  tourPopup.style.top = popTop + 'px';
  tourPopup.style.left = popLeft + 'px';
}

function nextTourStep(){
  if(tourIndex >= tourSteps.length - 1){ endTour(); return; }
  tourIndex++;
  showTourStep();
}

tourNextBtn.addEventListener('click', nextTourStep);
tourSkipBtn.addEventListener('click', endTour);
startTourBtn.addEventListener('click', () => {
  menuDropdown.classList.remove('open');
  startTour();
});
</script>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Bloco de Notas</title>
<script>
  /* aplica o tema salvo antes de pintar a página, para não piscar */
  (function(){
    try{
      if(localStorage.getItem('blocoDark') === '1'){
        document.documentElement.classList.add('dark');
      }
    }catch(e){}
  })();
</script>
<style>
  :root{
    --bg:#ffffff;
    --panel-bg:#ffffff;
    --search-bg:#fafafa;
    --placeholder:#aaaaaa;
    --border:#d9d9d9;
    --text:#1a1a1a;
    --muted:#8a8a8a;
    --accent:#2f6fed;
    --bad:#c23b3b;
    --good:#2f7d4f;
    --tab-bg:#f4f4f4;
    --hi:#fff59d;
  }
  html.dark{
    --bg:#000000;
    --panel-bg:#141310;
    --search-bg:#141310;
    --placeholder:#6b6350;
    --border:#3a3527;
    --text:#f4ecd2;
    --muted:#a89a78;
    --accent:#5b9dff;
    --bad:#e5605c;
    --good:#4caf6e;
    --tab-bg:#141310;
    --hi:#fff59d;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  html{ background:var(--bg); }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    display:flex;
    flex-direction:column;
  }

  /* ---------------- GATE ---------------- */
  #gate{ flex:1; display:flex; align-items:center; justify-content:center; padding:24px; }
  .gate-box{ width:100%; max-width:380px; }
  .gate-title{ font-size:15px; font-weight:600; margin:0 0 18px; color:var(--text); }
  .url-row{
    display:flex; align-items:center;
    border:1px solid var(--border); border-radius:2px;
    padding:0 10px; margin-bottom:10px;
  }
  .url-row .prefix{ color:var(--muted); font-size:14px; white-space:nowrap; }
  .url-row input{
    flex:1; border:none; outline:none; padding:10px 6px;
    font-size:14px; color:var(--text); min-width:0; font-family:inherit;
  }
  input[type=password]{
    width:100%; border:1px solid var(--border); border-radius:2px;
    padding:10px; font-size:14px; outline:none; margin-bottom:8px;
    font-family:inherit; color:var(--text);
  }
  input:focus{border-color:var(--accent);}
  .btn{
    font-family:inherit; font-size:13px; font-weight:600;
    border:1px solid var(--text); background:var(--text); color:var(--bg);
    border-radius:2px; padding:9px 16px; cursor:pointer;
  }
  .btn:hover{opacity:.85;}
  .btn:active{opacity:.7;}
  .btn.ghost{ background:var(--panel-bg); color:var(--text); border:1px solid var(--border); }
  .btn.ghost:hover{border-color:var(--text);}
  .btn.solid-danger{ background:var(--bad); color:#fff; border:1px solid var(--bad); }
  .btn.solid-danger:hover{ opacity:.9; }
  .btn[disabled]{opacity:.4; cursor:not-allowed;}

  .pw-panel{margin-top:14px;}
  .pw-panel .label{font-size:12.5px;color:var(--muted);margin-bottom:8px;}
  .row-btns{margin-top:4px;}
  .msg{font-size:12.5px;margin-top:8px;min-height:16px;}
  .msg.bad{color:var(--bad);}
  .msg.good{color:var(--good);}
  .hint{font-size:12px;color:var(--muted);margin:14px 0 0;}

  /* ---------------- EDITOR ---------------- */
  #editor{ display:none; flex-direction:column; height:100vh; position:relative; }
  .titlebar{
    display:flex; align-items:center; justify-content:flex-start;
    padding:6px 10px; border-bottom:1px solid var(--border);
    font-size:12.5px; color:var(--muted); flex:none; gap:10px;
  }
  .titlebar .name{color:var(--text);font-weight:600;}
  .titlebar .path{
    flex:none; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; max-width:40vw;
  }

  .link-btn{
    background:none;border:none;cursor:pointer;
    font-family:inherit;font-size:12.5px;color:var(--muted); padding:6px 4px; text-align:left; width:100%;
    display:block;
  }
  .link-btn:hover{color:var(--text);}
  .link-btn.danger{color:var(--bad);}
  .link-btn.danger:hover{color:var(--bad);}

  /* search */
  .search-box{
    display:flex; align-items:center; gap:5px;
    flex:0 1 190px; max-width:190px;
    margin-left:auto;
    border:1px solid var(--border); border-radius:13px;
    padding:3px 8px; background:var(--search-bg);
  }
  .search-box input{
    flex:1; border:none; outline:none; background:transparent;
    font-family:inherit; font-size:12px; color:var(--text); min-width:0;
  }
  .search-box .count{ font-size:10.5px; color:var(--muted); white-space:nowrap; }
  .search-box button{
    border:none; background:none; cursor:pointer; color:var(--muted);
    font-size:12px; padding:0 1px; line-height:1;
  }
  .search-box button:hover{ color:var(--text); }
  .search-box button:disabled{ opacity:.35; cursor:default; }

  /* destaque dos resultados da busca (via CSS Custom Highlight API, não altera o conteúdo real) */
  ::highlight(search-all-hl){
    background-color: rgba(255, 213, 79, 0.45);
  }
  ::highlight(search-current-hl){
    background-color: #ff9800;
    color: #1a1a1a;
  }

  /* responsividade da barra de título em telas pequenas */
  @media (max-width: 600px){
    .titlebar{ padding:6px 8px; gap:6px; }
    .titlebar .path{ max-width:28vw; font-size:11.5px; }
    .search-box{ flex:0 1 120px; max-width:120px; padding:3px 6px; }
    .search-box .count{ display:none; }
  }
  @media (max-width: 420px){
    .titlebar .path{ max-width:22vw; }
    .search-box{ flex:0 1 92px; max-width:92px; gap:3px; }
  }

  .icon-btn{
    flex:none; border:none; background:none; cursor:pointer; color:var(--muted);
    font-size:16px; padding:4px 6px; line-height:1; border-radius:4px;
  }
  .icon-btn:hover{ color:var(--text); }

  /* menu */
  .menu-wrap{ position:relative; flex:none; }
  #menuBtn{
    border:none; background:none; cursor:pointer; color:var(--muted);
    font-size:16px; padding:4px 8px; letter-spacing:2px;
  }
  #menuBtn:hover{ color:var(--text); }
  #menuDropdown{
    display:none; position:absolute; top:28px; right:0;
    background:var(--panel-bg); border:1px solid var(--border); border-radius:4px;
    box-shadow:0 4px 14px rgba(0,0,0,0.08);
    min-width:150px; padding:6px; z-index:20;
  }
  #menuDropdown.open{ display:block; }

  /* tabs */
  #tabs{
    flex:none; display:flex; align-items:stretch; overflow-x:auto;
    background:var(--tab-bg); border-bottom:1px solid var(--border);
  }
  .tab{
    display:flex;align-items:center;gap:8px;
    padding:8px 10px 8px 14px; font-size:12.5px;
    border-right:1px solid var(--border); color:var(--muted);
    cursor:grab; white-space:nowrap; max-width:180px; background:var(--tab-bg);
    position:relative;
  }
  .tab.tab-dragging{
    cursor:grabbing; z-index:5; box-shadow:0 4px 14px rgba(0,0,0,0.25);
    background:var(--panel-bg);
  }
  .tab.drop-before{ box-shadow: inset 3px 0 0 var(--accent); }
  .tab.drop-after{ box-shadow: inset -3px 0 0 var(--accent); }
  .tab .t-title{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tab.active{ background:var(--panel-bg); color:var(--text); font-weight:600; box-shadow: inset 0 -2px 0 var(--accent); }
  .tab .x{ border:none;background:none;color:var(--muted); font-size:13px;line-height:1;cursor:pointer;padding:2px 4px;border-radius:2px; }
  .tab .x:hover{ color:var(--bad); background:rgba(194,59,59,0.1); }
  .tab-add{ flex:none; display:flex; align-items:center; justify-content:center; width:38px; color:var(--muted); cursor:pointer; font-size:16px; background:var(--tab-bg); }
  .tab-add:hover{ color:var(--text); }

  #content{
    flex:1; width:100%; outline:none; overflow-y:auto;
    padding:18px 22px;
    font-family: Consolas, "Courier New", monospace !important;
    font-size:14px !important; line-height:1.6; color:var(--text);
    white-space:pre-wrap; word-wrap:break-word;
    position:relative;
  }
  #content, #content *{
    font-family: Consolas, "Courier New", monospace !important;
    font-size:14px !important;
  }
  #content:empty:before{
    content: attr(data-placeholder);
    color:var(--placeholder);
  }
  #content mark, #content [style*="background-color"]{
    background-color:var(--hi);
    color:#1a1a1a;
  }

  /* imagens coladas: movíveis e redimensionáveis */
  #content .img-wrap{
    position:absolute;
    cursor:move;
    user-select:none;
    -webkit-user-select:none;
    line-height:0;
    z-index:1;
  }
  #content .img-wrap img{
    display:block; width:100%; height:auto;
    pointer-events:none;
    border-radius:2px;
  }
  #content .img-wrap .img-resize-handle{
    position:absolute; right:-7px; bottom:-7px;
    width:14px; height:14px; border-radius:50%;
    background:var(--accent); border:2px solid var(--bg);
    cursor:nwse-resize;
  }
  #content .img-wrap .img-delete-handle{
    position:absolute; top:-9px; right:-9px;
    width:20px; height:20px; border-radius:50%;
    background:var(--bad); border:2px solid var(--bg);
    color:#fff; font-size:13px; font-weight:700; line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  #content .img-wrap.dragging,
  #content .img-wrap.resizing{
    opacity:.85;
  }

  .statusbar{
    flex:none; display:flex; justify-content:space-between; align-items:center;
    padding:6px 12px; border-top:1px solid var(--border);
    font-size:11.5px; color:var(--muted);
  }

  #changePwPanel{ display:none; flex:none; border-top:1px solid var(--border); padding:14px 22px; }
  #changePwPanel .label{font-size:12.5px;color:var(--muted);margin-bottom:8px;}
  #changePwPanel input{max-width:220px;display:inline-block;margin-right:8px;}

  /* custom confirm/info modal (window.confirm/alert are blocked inside this sandbox) */
  .overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.35);
    align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .overlay.open{ display:flex; }
  .overlay-box{
    background:var(--panel-bg); border-radius:6px; max-width:340px; width:100%;
    padding:20px; box-shadow:0 10px 30px rgba(0,0,0,0.2);
  }
  .overlay-box p{ margin:0 0 18px; font-size:13.5px; color:var(--text); line-height:1.5; }
  .overlay-actions{ display:flex; justify-content:flex-end; gap:8px; }

  /* floating selection toolbar */
  #selToolbar{
    position:fixed; display:none; align-items:center; gap:2px;
    background:#222; border-radius:6px; padding:4px; box-shadow:0 4px 14px rgba(0,0,0,0.25);
    z-index:50;
  }
  #selToolbar button{
    border:none; background:none; color:#fff; cursor:pointer;
    width:28px; height:26px; border-radius:4px; font-size:13px;
    display:flex; align-items:center; justify-content:center;
  }
  #selToolbar button:hover{ background:rgba(255,255,255,0.15); }
  #selToolbar button.b{ font-weight:800; }
  #selToolbar .swatch{
    width:14px;height:14px;border-radius:3px;background:var(--hi);display:inline-block;
  }
  #selToolbar #btnClear{ border-left:1px solid rgba(255,255,255,0.15); margin-left:2px; padding-left:6px; width:30px; }

  /* ---------------- TOUR GUIADO ---------------- */
  #tourRoot{ display:none; }
  #tourRoot.open{ display:block; }
  #tourBackdrop{
    position:fixed; inset:0; z-index:300;
    background:rgba(20,20,20,0.45);
    -webkit-backdrop-filter:blur(4px);
    backdrop-filter:blur(4px);
    transition:clip-path .25s ease;
  }
  #tourRing{
    position:fixed; z-index:301; pointer-events:none;
    border:2px solid #fff; border-radius:10px;
    box-shadow:0 0 0 3px rgba(47,111,237,0.55), 0 4px 18px rgba(0,0,0,0.3);
    transition:top .25s ease, left .25s ease, width .25s ease, height .25s ease;
  }
  #tourPopup{
    position:fixed; z-index:302; width:270px; max-width:calc(100vw - 20px);
    background:var(--panel-bg); border-radius:8px; padding:16px;
    box-shadow:0 12px 30px rgba(0,0,0,0.3);
    transition:top .25s ease, left .25s ease;
  }
  #tourStepLabel{
    font-size:10.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
    color:var(--accent); margin-bottom:6px;
  }
  #tourTitle{ font-size:14.5px; font-weight:700; color:var(--text); margin-bottom:6px; }
  #tourText{ font-size:12.5px; color:var(--text); line-height:1.55; margin-bottom:16px; }
  .tour-actions{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  #tourSkipBtn{
    background:none; border:none; cursor:pointer; font-family:inherit;
    font-size:12px; color:var(--muted); padding:6px 2px;
  }
  #tourSkipBtn:hover{ color:var(--text); text-decoration:underline; }
  #tourNextBtn{
    font-family:inherit; font-size:12.5px; font-weight:600;
    border:1px solid var(--text); background:var(--text); color:#fff;
    border-radius:4px; padding:8px 16px; cursor:pointer; flex:none;
  }
  #tourNextBtn:hover{ opacity:.85; }
</style>
</head>
<body>

  <!-- GATE -->
  <div id="gate">
    <div class="gate-box">
      <p class="gate-title">Abrir ou criar sua página</p>

        <path d="M20 20H7L3 16C2.5 15.5 2.5 14.5 3 14L13 4C13.5 3.5 14.5 3.5 15 4L21 10C21.5 10.5 21.5 11.5 21 12L11 22" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

<script>
/* =======================================================================
   CONFIGURAÇÃO DO SUPABASE
   Cole aqui a "Project URL" e a chave "anon public" do seu projeto
   (Project Settings → API no painel do Supabase).
   ======================================================================= */
const SUPABASE_URL = 'https://emcmflrwgypbymwsxbqi.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_29ce8F59T5B9S8Zv8IO1Kg_7Fq4dCJC';

const storage = {
  async get(key){
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/notes?key=eq.${encodeURIComponent(key)}&select=value`,
      { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } }
    );
    if(!res.ok) throw new Error('Falha ao ler do banco');
    const rows = await res.json();
    if(!rows.length) return null;
    return { value: rows[0].value };
  },
  async set(key, value){
    const res = await fetch(`${SUPABASE_URL}/rest/v1/notes`, {
      method: 'POST',
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json',
        Prefer: 'resolution=merge-duplicates'
      },
      body: JSON.stringify({ key, value })
    });
    if(!res.ok) throw new Error('Falha ao salvar no banco');
    return true;
  },
  async delete(key){
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/notes?key=eq.${encodeURIComponent(key)}`,
      { method: 'DELETE', headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } }
    );
    if(!res.ok) throw new Error('Falha ao excluir do banco');
    return true;
  }
};

const gate = document.getElementById('gate');
const editor = document.getElementById('editor');
const slugInput = document.getElementById('slugInput');
const goBtn = document.getElementById('goBtn');
const pwPanel = document.getElementById('pwPanel');

let currentSlug = null;
let currentKey = null;
let sessionSalt = null;

let pages = [];          // {id, content}  content = innerHTML string
let activePageId = null;
let autosaveTimer = null;

function keyFor(slug){ return 'note:' + slug.trim().toLowerCase(); }
function b64(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function unb64(str){ return Uint8Array.from(atob(str), c => c.charCodeAt(0)); }
function newId(){ return Math.random().toString(36).slice(2,10); }
function htmlToText(html){ const d = document.createElement('div'); d.innerHTML = html || ''; return d.innerText || d.textContent || ''; }

async function deriveKey(password, saltBytes){
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt: saltBytes, iterations: 120000, hash:'SHA-256' },
    baseKey, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']
  );
}
async function encryptPayload(obj, password){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(password, salt);
  const enc = new TextEncoder();
  const cipher = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(JSON.stringify(obj)));
  return { payload: JSON.stringify({ s: b64(salt), i: b64(iv), c: b64(cipher) }), key };
}
async function decryptPayload(payloadStr, password){
  const { s, i, c } = JSON.parse(payloadStr);
  const salt = unb64(s), iv = unb64(i), cipher = unb64(c);
  const key = await deriveKey(password, salt);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, cipher);
  const text = new TextDecoder().decode(plain);
  let obj;
  try{ obj = JSON.parse(text); }catch(e){ obj = { pages: [{ id:newId(), content:text }] }; }
  if(!obj.pages || !obj.pages.length) obj.pages = [{ id:newId(), content:'' }];
  return { obj, key };
}
async function reencryptWithKey(obj, key, salt, iv){
  const enc = new TextEncoder();
  const cipher = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(JSON.stringify(obj)));
  return JSON.stringify({ s: b64(salt), i: b64(iv), c: b64(cipher) });
}

    confirmMsg.textContent = message;

    }

  });

/* ---- arrastar abas para reordenar as páginas ----
   A aba arrastada segue o ponteiro visualmente (transform), enquanto um
   indicador mostra onde ela vai encaixar; a ordem só é aplicada ao soltar. */
let tabDragJustEnded = false;
function setupTabDrag(tabEl, pageId){
  let startX, startY, pointerId, dragging = false;
  let dropTargetEl = null, dropBefore = true;

  tabEl.addEventListener('pointerdown', (e) => {
    if(e.target.closest('.x')) return;
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    startX = e.clientX; startY = e.clientY;
    pointerId = e.pointerId;
    dragging = false;
    dropTargetEl = null;
    tabEl.addEventListener('pointermove', onMove);
    tabEl.addEventListener('pointerup', onUp);
    tabEl.addEventListener('pointercancel', onUp);
  });

  function clearIndicator(){
    if(dropTargetEl){
      dropTargetEl.classList.remove('drop-before', 'drop-after');
      dropTargetEl = null;
    }
  }

  function onMove(e){
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if(!dragging){
      if(Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
      dragging = true;
      try{ tabEl.setPointerCapture(pointerId); }catch(err){}
      tabEl.classList.add('tab-dragging');
      tabEl.style.touchAction = 'none';
      tabEl.style.pointerEvents = 'none'; // deixa o hit-test "enxergar" as abas por baixo
    }
    e.preventDefault();
    tabEl.style.transform = `translateX(${dx}px)`;

    const el = document.elementFromPoint(e.clientX, e.clientY);
    const targetTab = el ? el.closest('.tab') : null;
    clearIndicator();
    if(targetTab && targetTab !== tabEl && tabsEl.contains(targetTab)){
      const rect = targetTab.getBoundingClientRect();
      dropBefore = e.clientX < rect.left + rect.width / 2;
      targetTab.classList.add(dropBefore ? 'drop-before' : 'drop-after');
      dropTargetEl = targetTab;
    }
  }

  function onUp(){
    tabEl.removeEventListener('pointermove', onMove);
    tabEl.removeEventListener('pointerup', onUp);
    tabEl.removeEventListener('pointercancel', onUp);
    if(dragging){
      tabEl.classList.remove('tab-dragging');
      tabEl.style.transform = '';
      tabEl.style.touchAction = '';
      tabEl.style.pointerEvents = '';
      if(dropTargetEl){
        const targetId = dropTargetEl.dataset.id;
        const fromIdx = pages.findIndex(p => p.id === pageId);
        if(fromIdx !== -1){
          const [moved] = pages.splice(fromIdx, 1);
          let toIdx = pages.findIndex(p => p.id === targetId);
          if(toIdx === -1) toIdx = pages.length;
          else if(!dropBefore) toIdx += 1;
          pages.splice(toIdx, 0, moved);
        }
      }
      clearIndicator();
      tabDragJustEnded = true;
      renderTabs();
      scheduleAutosave();
    }
    dragging = false;
  }
}

async function deletePage(id){
  if(pages.length && pages[0].id === id){
    await askAlert('A primeira página não pode ser excluída.');
    return;
  }
  if(pages.length === 1){
    await askAlert('Precisa ter pelo menos uma página. Escreva algo novo em vez de excluir.');
    return;
  }
  const page = pages.find(p => p.id === id);
  const label = titleFor(page);
  const ok = await askConfirm(`Tem certeza que quer excluir a página "${label}"? Essa ação não pode ser desfeita.`, 'Excluir página');
  if(!ok) return;
  const idx = pages.findIndex(p => p.id === id);
  pages.splice(idx, 1);
  if(activePageId === id){
    const next = pages[Math.max(0, idx - 1)];
    activePageId = next.id;
    contentEl.innerHTML = next.content;
    reattachContentImages();
    clearSearch();
  }
  renderTabs();
  scheduleAutosave();
}

/* ---- search ---- */
let matches = []; // {node, start, end}
let matchIndex = -1;
let hasNavigated = false; // só vira true quando o usuário navega de fato (Enter/setas)
const supportsHighlightApi = !!(window.Highlight && CSS.highlights);
let searchAllHl = null, searchCurrentHl = null;

function collectTextNodes(root){
  const nodes = [];
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  let n;
  while(n = walker.nextNode()) nodes.push(n);
  return nodes;
}
function makeMatchRange(m){
  const range = document.createRange();
  range.setStart(m.node, m.start);
  range.setEnd(m.node, m.end);
  return range;
}
function paintHighlights(){
  if(!supportsHighlightApi) return;
  if(!matches.length){
    CSS.highlights.delete('search-all-hl');
    CSS.highlights.delete('search-current-hl');
    return;
  }
  const ranges = matches.map(makeMatchRange);
  searchAllHl = new Highlight(...ranges);
  CSS.highlights.set('search-all-hl', searchAllHl);
  if(matchIndex >= 0){
    searchCurrentHl = new Highlight(ranges[matchIndex]);
    CSS.highlights.set('search-current-hl', searchCurrentHl);
  }else{
    CSS.highlights.delete('search-current-hl');
  }
}
function computeMatches(query, keepIndex){
  const prevMatchNode = (keepIndex && matches[matchIndex]) ? matches[matchIndex].node : null;
  const prevMatchStart = (keepIndex && matches[matchIndex]) ? matches[matchIndex].start : -1;
  matches = [];
  matchIndex = -1;
  if(!keepIndex) hasNavigated = false;
  if(!query){ updateSearchUI(); paintHighlights(); return; }
  const q = query.toLowerCase();
  const nodes = collectTextNodes(contentEl);
  nodes.forEach(node => {
    const text = node.textContent.toLowerCase();
    let from = 0, idx;
    while((idx = text.indexOf(q, from)) !== -1){
      matches.push({ node, start: idx, end: idx + q.length });
      from = idx + q.length;
    }
  });
  if(matches.length){
    if(keepIndex && prevMatchNode){
      const found = matches.findIndex(m => m.node === prevMatchNode && m.start === prevMatchStart);
      matchIndex = found !== -1 ? found : 0;
    }else{
      matchIndex = 0;
    }
  }
  // Apenas atualiza a contagem/realce; NÃO move o foco enquanto digita.
  updateSearchUI();
  paintHighlights();
}
function scrollMatchIntoView(range){
  const rect = range.getBoundingClientRect();
  const box = contentEl.getBoundingClientRect();
  if(rect.top >= box.top && rect.bottom <= box.bottom) return; // já visível
  const delta = (rect.top - box.top) - (box.height / 2) + (rect.height / 2);
  contentEl.scrollBy({ top: delta, behavior:'smooth' });
}
function goToMatch(i){
  if(!matches.length) return;
  matchIndex = ((i % matches.length) + matches.length) % matches.length;
  hasNavigated = true;
  const range = makeMatchRange(matches[matchIndex]);
  scrollMatchIntoView(range);
  paintHighlights();
  updateSearchUI();
}
function navigate(direction){
  // primeira navegação vai para o match atual (0); as seguintes avançam/recuam
  if(!hasNavigated){ goToMatch(matchIndex); }
  else { goToMatch(matchIndex + direction); }
}
function updateSearchUI(){
  if(!matches.length){
    searchCount.textContent = searchInput.value ? '0/0' : '';
  }else{
    searchCount.textContent = (matchIndex+1) + '/' + matches.length;
  }
  searchPrev.disabled = matches.length === 0;
  searchNext.disabled = matches.length === 0;
}
searchInput.addEventListener('input', () => computeMatches(searchInput.value.trim()));
searchInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){ e.preventDefault(); navigate(e.shiftKey ? -1 : 1); }
  if(e.key === 'Escape'){ searchInput.value = ''; computeMatches(''); searchInput.blur(); }
});
searchNext.addEventListener('click', () => navigate(1));
searchPrev.addEventListener('click', () => navigate(-1));
function clearSearch(){
  searchInput.value = '';
  computeMatches('');
}

/* ---------------------------------------------------------------
   COLAR TEXTO: sempre com a fonte/tamanho padrão do bloco
   (mantém apenas negrito e marca-texto, ignora fonte, tamanho,
   cor e qualquer outra formatação vinda de fora)
--------------------------------------------------------------- */
const BLOCK_TAGS = new Set(['P','DIV','LI','TR','H1','H2','H3','H4','H5','H6','BLOCKQUOTE']);

function isHighlighted(node){
  const bg = node.style && node.style.backgroundColor;
  return node.tagName === 'MARK' || (bg && bg !== '' && bg !== 'transparent' && bg !== 'rgba(0, 0, 0, 0)');
}
function isBold(node){
  if(node.tagName === 'B' || node.tagName === 'STRONG') return true;
  const w = node.style && node.style.fontWeight;
  if(!w) return false;
  const n = parseInt(w, 10);
  return w === 'bold' || (!isNaN(n) && n >= 600);
}

function sanitizeIntoFragment(srcParent, destParent){
  srcParent.childNodes.forEach(node => {
    if(node.nodeType === Node.TEXT_NODE){
      destParent.appendChild(document.createTextNode(node.textContent));
      return;
    }
    if(node.nodeType !== Node.ELEMENT_NODE) return;
    const tag = node.tagName;
    if(tag === 'IMG' || tag === 'SCRIPT' || tag === 'STYLE') return; // imagens coladas via HTML são ignoradas (usamos o arquivo real do clipboard)
    if(tag === 'BR'){ destParent.appendChild(document.createElement('br')); return; }

    let wrapper = destParent;
    if(isHighlighted(node)){
      wrapper = document.createElement('mark');
      destParent.appendChild(wrapper);
    }else if(isBold(node)){
      wrapper = document.createElement('b');
      destParent.appendChild(wrapper);
    }
    sanitizeIntoFragment(node, wrapper);

    if(BLOCK_TAGS.has(tag) && node.nextSibling){
      destParent.appendChild(document.createElement('br'));
    }
  });
}

function sanitizePastedHtml(html){
  const src = document.createElement('div');
  src.innerHTML = html;
  const out = document.createElement('div');
  sanitizeIntoFragment(src, out);
  return out.innerHTML;
}

/* ---------------------------------------------------------------
   COLAR IMAGEM: insere como bloco movível e redimensionável
--------------------------------------------------------------- */
function makeImageInteractive(wrap){
  const handle = wrap.querySelector('.img-resize-handle');
  const deleteHandle = wrap.querySelector('.img-delete-handle');
  const img = wrap.querySelector('img');

  if(deleteHandle){
    deleteHandle.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); });
    deleteHandle.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      wrap.remove();
      syncActiveContentFromEditor();
      renderTabs();
      scheduleAutosave();
    });
  }

  wrap.addEventListener('pointerdown', (e) => {
    if(e.target === handle || e.target === deleteHandle) return;
    e.preventDefault();
    wrap.classList.add('dragging');
    const contentRect = contentEl.getBoundingClientRect();
    const startLeft = parseFloat(wrap.style.left) || 0;
    const startTop = parseFloat(wrap.style.top) || 0;
    const startX = e.clientX, startY = e.clientY;
    wrap.setPointerCapture(e.pointerId);
    function onMove(ev){
      const dx = ev.clientX - startX, dy = ev.clientY - startY;
      let left = startLeft + dx;
      let top = startTop + dy;
      left = Math.max(0, Math.min(left, contentEl.scrollWidth - 20));
      top = Math.max(0, top);
      wrap.style.left = left + 'px';
      wrap.style.top = top + 'px';
    }
    function onUp(ev){
      wrap.classList.remove('dragging');
      wrap.removeEventListener('pointermove', onMove);
      wrap.removeEventListener('pointerup', onUp);
      syncActiveContentFromEditor();
      scheduleAutosave();
    }
    wrap.addEventListener('pointermove', onMove);
    wrap.addEventListener('pointerup', onUp);
  });

  handle.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    e.stopPropagation();
    wrap.classList.add('resizing');
    const startWidth = wrap.offsetWidth;
    const startX = e.clientX;
    handle.setPointerCapture(e.pointerId);
    function onMove(ev){
      const dx = ev.clientX - startX;
      let newWidth = startWidth + dx;
      newWidth = Math.max(40, Math.min(newWidth, Math.max(contentEl.clientWidth - 20, 40)));
      wrap.style.width = newWidth + 'px';
    }
    function onUp(ev){
      wrap.classList.remove('resizing');
      handle.removeEventListener('pointermove', onMove);
      handle.removeEventListener('pointerup', onUp);
      syncActiveContentFromEditor();
      scheduleAutosave();
    }
    handle.addEventListener('pointermove', onMove);
    handle.addEventListener('pointerup', onUp);
  });
}

function reattachContentImages(){
  contentEl.querySelectorAll('.img-wrap').forEach(makeImageInteractive);
}

function insertImageWrap(dataUrl){
  const wrap = document.createElement('div');
  wrap.className = 'img-wrap';
  wrap.contentEditable = 'false';
  const offset = contentEl.querySelectorAll('.img-wrap').length * 16;
  wrap.style.left = (20 + offset) + 'px';
  wrap.style.top = (contentEl.scrollTop + 20 + offset) + 'px';
  wrap.style.width = '220px';

  const img = document.createElement('img');
  img.src = dataUrl;
  img.draggable = false;
  img.alt = 'imagem colada';

  const handle = document.createElement('div');
  handle.className = 'img-resize-handle';

  const deleteHandle = document.createElement('div');
  deleteHandle.className = 'img-delete-handle';
  deleteHandle.title = 'Excluir imagem';
  deleteHandle.textContent = '×';

  wrap.appendChild(img);
  wrap.appendChild(handle);
  wrap.appendChild(deleteHandle);
  contentEl.appendChild(wrap);
  makeImageInteractive(wrap);

  syncActiveContentFromEditor();
  renderTabs();
  scheduleAutosave();
}

function insertImageFile(file){
  const reader = new FileReader();
  reader.onload = (ev) => insertImageWrap(ev.target.result);
  reader.readAsDataURL(file);
}

/* ---------------------------------------------------------------
   Handler de colar: imagem -> bloco movível; texto -> texto puro
   no padrão do bloco (sem fonte/tamanho/cor externos)
--------------------------------------------------------------- */
contentEl.addEventListener('paste', (e) => {
  const dt = e.clipboardData || window.clipboardData;
  if(!dt) return;
  e.preventDefault();

  let imageFile = null;
  if(dt.files && dt.files.length){
    for(const f of dt.files){ if(f.type && f.type.startsWith('image/')){ imageFile = f; break; } }
  }
  if(!imageFile && dt.items){
    for(const it of dt.items){
      if(it.kind === 'file' && it.type && it.type.startsWith('image/')){ imageFile = it.getAsFile(); break; }
    }
  }
  if(imageFile){ insertImageFile(imageFile); return; }

  const html = dt.getData('text/html');
  if(html && html.trim()){
    const clean = sanitizePastedHtml(html);
    document.execCommand('insertHTML', false, clean);
  }else{
    const text = dt.getData('text/plain');
    if(text) document.execCommand('insertText', false, text);
  }
  syncActiveContentFromEditor();
  renderTabs();
  scheduleAutosave();
});

let tourIndex = 0;
let tourActive = false;

function maybeStartTour(){
  let done = '0';
  try{ done = localStorage.getItem('blocoTourDone') || '0'; }catch(e){}
  if(done === '1') return;
  setTimeout(startTour, 500);
}

function startTour(){
  menuDropdown.classList.remove('open');
  tourIndex = 0;
  tourActive = true;
  tourRoot.classList.add('open');
  showTourStep();
  window.addEventListener('resize', onTourReposition);
  window.addEventListener('scroll', onTourReposition, true);
}

function onTourReposition(){
  if(!tourActive) return;
  positionTourFor(tourSteps[tourIndex].selector);
}

function endTour(){
  tourActive = false;
  tourRoot.classList.remove('open');
  window.removeEventListener('resize', onTourReposition);
  window.removeEventListener('scroll', onTourReposition, true);
  try{ localStorage.setItem('blocoTourDone', '1'); }catch(e){}
}

function showTourStep(){
  const step = tourSteps[tourIndex];
  const target = document.querySelector(step.selector);
  if(!target){ nextTourStep(); return; }
  tourStepLabel.textContent = 'Passo ' + (tourIndex+1) + ' de ' + tourSteps.length;
  tourTitle.textContent = step.title;
  tourText.textContent = step.text;
  tourNextBtn.textContent = (tourIndex === tourSteps.length - 1) ? 'Concluir' : 'Próximo';
  positionTourFor(step.selector);
}

function positionTourFor(selector){
  const target = document.querySelector(selector);
  if(!target) return;
  const rect = target.getBoundingClientRect();
  const pad = 8;
  const W = window.innerWidth, H = window.innerHeight;
  const x = Math.max(4, rect.left - pad);
  const y = Math.max(4, rect.top - pad);
  const w = Math.min(W - x - 4, rect.width + pad*2);
  const h = Math.min(H - y - 4, rect.height + pad*2);

  // recorta o fundo desfocado deixando um "buraco" nítido sobre o alvo
  const d = `M0,0 H${W} V${H} H0 Z M${x},${y} H${x+w} V${y+h} H${x} Z`;
  tourClipPathShape.setAttribute('d', d);

  tourRing.style.left = x + 'px';
  tourRing.style.top = y + 'px';
  tourRing.style.width = w + 'px';
  tourRing.style.height = h + 'px';

  // posiciona o popup embaixo do alvo; se não couber, coloca em cima
  const popupWidth = 270;
  const estimatedPopupHeight = tourPopup.offsetHeight || 150;
  let popTop = y + h + 14;
  if(popTop + estimatedPopupHeight > H - 10){
    popTop = Math.max(10, y - estimatedPopupHeight - 14);
  }
  let popLeft = x;
  if(popLeft + popupWidth > W - 10) popLeft = W - popupWidth - 10;
  if(popLeft < 10) popLeft = 10;
  tourPopup.style.top = popTop + 'px';
  tourPopup.style.left = popLeft + 'px';
}

function nextTourStep(){
  if(tourIndex >= tourSteps.length - 1){ endTour(); return; }
  tourIndex++;
  showTourStep();
}

tourNextBtn.addEventListener('click', nextTourStep);
tourSkipBtn.addEventListener('click', endTour);
startTourBtn.addEventListener('click', () => {
  menuDropdown.classList.remove('open');
  startTour();
});
</script>
